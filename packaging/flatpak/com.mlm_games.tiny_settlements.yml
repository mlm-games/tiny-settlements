id: com.mlm-games.tiny-settlements
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: tiny-settlements
modules:
  - name: tiny-settlements
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/tiny-settlements /app/bin/tiny-settlements
    sources:
      - type: dir
        path: .
