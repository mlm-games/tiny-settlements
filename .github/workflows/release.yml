name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: mlm-games/ci/.github/workflows/rust-app-release.yml@main
    with:
      working-directory: .
      app-slug: tiny-settlements
      system-deps-linux: libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      include-web: true
      include-android: true
      include-universal: true
      itch-username: mlm-games
      itch-game: tiny-settlements
    secrets: inherit
